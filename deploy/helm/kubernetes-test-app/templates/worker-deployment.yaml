{{- include "kubernetes-test-app.validateWorkerMode" . }}
{{- /*
Workers in loop mode, as a Deployment. Rendered in two worker.mode values:
  deployment   - scaled by hand: replicas from worker.replicas (Stage 3a)
  scaledobject - scaled by KEDA (worker-scaledobject.yaml), 0..maxReplicaCount
In scaledjob mode there is no Deployment; see worker-scaledjob.yaml.
*/}}
{{- if has .Values.worker.mode (list "deployment" "scaledobject") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "kubernetes-test-app.labels" (dict "ctx" $ "component" "worker") | nindent 4 }}
spec:
  {{- if eq .Values.worker.mode "deployment" }}
  # Rendered as-is (no `default`), so worker.replicas=0 really means 0.
  replicas: {{ .Values.worker.replicas }}
  {{- else }}
  {{- /*
  scaledobject mode: NO replicas field. KEDA's HPA owns the count. If Helm
  also set it, every `helm upgrade` would reset the count (the drift from
  Stage 3a experiment 3), or conflict with the HPA under server-side apply.
  */}}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kubernetes-test-app.selectorLabels" (dict "ctx" $ "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubernetes-test-app.labels" (dict "ctx" $ "component" "worker") | nindent 8 }}
      annotations:
        {{- include "kubernetes-test-app.configChecksum" . | nindent 8 }}
    spec:
      {{- include "kubernetes-test-app.workerPodSpec" (dict "ctx" $ "workerMode" "loop" "restartPolicy" "Always") | nindent 6 }}
{{- end }}
